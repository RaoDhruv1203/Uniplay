<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNiPLAY Player</title><link rel="stylesheet" href="pip.css"></head>
<body><div class="pip" id="pip">
  <video id="video" autoplay playsinline></video>
  <iframe id="youtube-frame" title="YouTube player" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  <div class="shade"></div><div class="drag"></div>
  <div class="top"><strong id="title">UNiPLAY</strong><div class="buttons"><button id="audio-mode" title="Compact audio mode"><img src="icons/music-2.svg" alt=""></button><button id="pin" title="Always on top"><img src="icons/pin.svg" alt=""></button><button id="close" title="Close"><img src="icons/x.svg" alt=""></button></div></div>
  <div class="controls"><button id="back" title="Previous channel"><img src="icons/skip-back.svg" alt=""></button><button id="rewind" title="Back 10 seconds"><img src="icons/rotate-ccw.svg" alt=""></button><button id="toggle" class="primary" title="Play or pause"><img src="icons/pause.svg" alt=""></button><button id="skip" title="Forward 10 seconds"><img src="icons/skip-forward.svg" alt=""></button><button id="forward" title="Next channel"><img src="icons/skip-forward.svg" alt=""></button></div>
  <div class="timeline"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Playback position"></div>
  <button id="explore-tab" title="Explore videos" aria-label="Explore videos"><img src="icons/search.svg" alt=""><span>Explore</span></button>
  <aside id="explore-panel" aria-label="Explore YouTube videos"><div class="explore-head"><span>Explore</span><button id="explore-close" title="Close explore"><img src="icons/x.svg" alt=""></button></div><div class="explore-search"><input id="explore-query" placeholder="Search videos" aria-label="Search videos"><button id="explore-go" title="Search"><img src="icons/search.svg" alt=""></button></div><div id="explore-status"></div><div id="explore-results"></div></aside>
  <div id="audio-shell"><div class="audio-main"><img id="audio-cover" src="uniplay.svg" alt=""><div class="audio-body"><div class="audio-title" id="audio-title">UNiPLAY</div><div class="audio-artist" id="audio-artist">Your music, in motion</div><div class="audio-progress"><input id="audio-seek" type="range" min="0" max="1000" value="0" aria-label="Audio position"><div><span id="audio-current">0:00</span><span id="audio-total">0:00</span></div></div><div class="audio-controls"><button id="audio-heart" title="Save to Liked"><img src="icons/heart.svg" alt=""></button><button id="audio-back" title="Previous"><img src="icons/skip-back.svg" alt=""></button><button id="audio-toggle" class="audio-play" title="Play or pause"><img src="icons/pause.svg" alt=""></button><button id="audio-forward" title="Next"><img src="icons/skip-forward.svg" alt=""></button><button id="audio-list" title="Your playlists"><img src="icons/list.svg" alt=""></button></div></div></div><div class="audio-shelf" id="audio-shelf"><div class="shelf-head"><strong>Your playlists</strong><button id="audio-shelf-close" title="Close playlists"><img src="icons/x.svg" alt=""></button></div><div class="shelf-tools"><select id="audio-playlist" aria-label="Current playlist"></select><button id="audio-new" title="Create playlist">+</button></div><div class="shelf-new" id="audio-new-row" hidden><input id="audio-new-name" placeholder="Playlist name"><button id="audio-new-save">Save</button></div><div class="shelf-search"><input id="audio-search" placeholder="Find saved audio" aria-label="Find saved audio"></div><div class="shelf-tracks" id="audio-tracks"></div></div></div>
</div><script src="hls.min.js"></script><script src="pip.js"></script></body></html>
